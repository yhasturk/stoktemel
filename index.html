<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Stok Temel</title>
    <!-- GÖMÜLÜ SVG LOGO -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='65' font-size='50' font-family='Arial' font-weight='bold' fill='%23f44336' text-anchor='middle'%3ETO%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
        }
        
        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Giriş, Kayıt ve Şifre Sıfırlama Ekranları */
        #authEkrani, #SifreSifirlamaEkrani { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #121212; width: 100%; }
        .auth-kutu { background-color: #1e1e1e; padding: 40px; border-radius: 10px; border: 1px solid #333; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin: 0 auto; }
        .auth-kutu h2 { color: #00bcd4; margin-top: 0; margin-bottom: 25px; }
        .auth-kutu input { width: 100%; margin-bottom: 15px; padding: 12px; background-color: #121212; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        .auth-kutu input:focus { border-color: #00bcd4; }
        .btn-auth { width: 100%; padding: 12px; background-color: #00bcd4; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-auth:hover { background-color: #008ba3; }
        .btn-kayitol { background-color: transparent; color: #00bcd4; border: 1px solid #00bcd4; }
        .btn-kayitol:hover { background-color: rgba(0, 188, 212, 0.1); }
        .link-unuttum { color: #aaa; font-size: 13px; text-decoration: underline; cursor: pointer; transition: color 0.2s; }
        .link-unuttum:hover { color: #00bcd4; }

        #anaUygulama { display: none; width: 100%; }

        /* SIFIR ZIPLAMA YAPAN SABİT ÜST BLOK */
        .sabit-ust-alan {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #121212;
            border-bottom: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            width: 100%;
        }
        
        .ust-bosluklu-container { padding-top: 15px; padding-bottom: 15px; }

        .ana-baslik {
            text-align: center;
            color: #ffd700;
            margin: 0 auto 15px auto;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 800;
            width: 100%;
        }

        /* Arama ve Kontrol Paneli */
        .header { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; width: 100%;}
        
        .header input, .header select { 
            background-color: #1e1e1e; 
            color: #fff; 
            border: 1px solid #444; 
            height: 38px; 
            padding: 0 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none; 
            text-transform: uppercase;
            width: 100%;
        }
        
        /* BİLGİSAYARDA LİSTE YAZILARINI KÜÇÜLTME */
        .header select { font-size: 12px; }

        .header input::placeholder { text-transform: none; }
        .header input:focus, .header select:focus { border-color: #00bcd4; }
        
        #aramaKutusu { flex: 2; min-width: 140px; }
        #kategoriFiltre { flex: 1; min-width: 110px; }
        #markaFiltre { flex: 1; min-width: 110px; }
        
        /* EŞİT GENİŞLİKLİ BUTON GRUBU */
        .buton-grup { display: flex; gap: 8px; flex: 2; min-width: 310px;}
        .buton-grup button { 
            flex: 1; 
            height: 38px; 
            padding: 0 4px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 11.5px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            white-space: nowrap;
        }
        .btn-yeni { background-color: #4caf50; color: #fff; }
        .btn-yeni:hover { background-color: #388e3c; }
        .btn-excel { background-color: #ff9800; color: #000; }
        .btn-excel:hover { background-color: #f57c00; }
        .btn-log { background-color: #9c27b0; color: #fff; }
        .btn-log:hover { background-color: #7b1fa2; }
        .btn-cikis { background-color: #f44336; color: #fff; }
        .btn-cikis:hover { background-color: #d32f2f; }
        
        .liste-alani { display: flex; flex-direction: column; gap: 10px; padding-top: 15px; padding-bottom: 30px; width: 100%; }

        .stok-satir { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 18px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 25px; width: 100%; transition: all 0.3s ease; }
        .stok-satir:hover { background-color: #222; border-color: #444; }
        
        /* ÖZEL KASALAR TASARIMI VE ANİMASYON */
        .kasa-satir { background-color: #2e1a12 !important; border: 2px solid #ff5722 !important; box-shadow: 0 0 12px rgba(255, 87, 34, 0.2); }
        .kasa-satir:hover { background-color: #3d2318 !important; border-color: #ff7043 !important; }
        
        @keyframes blink {
            0% { opacity: 1; box-shadow: 0 0 10px #ff5722; }
            50% { opacity: 0.5; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 10px #ff5722; }
        }
        
        .stok-bilgi { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .stok-ust-satir { display: flex; align-items: center; gap: 10px; }
        
        .kategori-etiket { background-color: #2a2a2a; color: #00bcd4; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .kasa-etiket { background-color: #ff5722 !important; color: #fff !important; font-size: 13px !important; letter-spacing: 1px; animation: blink 1.5s infinite; border-radius: 6px; padding: 4px 10px; }
        
        .malzeme-kod { font-size: 16px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .malzeme-detay { font-size: 13px; color: #aaa; text-transform: uppercase; }
        .raf-no-vurgu { color: #f44336; font-weight: bold; }
        .kasa-no-vurgu { color: #ff9800 !important; font-weight: 900 !important; font-size: 14px; }

        /* Masaüstü için tam isimli başlıklar */
        .stok-sayilar { display: grid; grid-template-columns: repeat(5, 85px); gap: 6px; text-align: center; }
        .sayi-kutusu { font-size: 10px; color: #aaa; background-color: #222; padding: 4px 2px; border-radius: 4px; border: 1px solid #2a2a2a; font-weight: bold; }
        .sayi-deger, .sayi-toplam, .sayi-arizali { font-size: 14px; font-weight: bold; margin-top: 2px; }
        .sayi-deger { color: #fff; }
        .sayi-toplam { color: #4caf50; }
        .sayi-arizali { color: #f44336; }
        
        .btn-duzenle { background-color: #00bcd4; color: #000; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; justify-self: end; }
        .btn-duzenle:hover { background-color: #008ba3; }
        .btn-pasif { background-color: #333; color: #666; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; justify-self: end; cursor: not-allowed; }

        /* MODAL TASARIMLARI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: #1e1e1e; padding: 25px 30px; border-radius: 12px; width: 90%; max-width: 420px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.7); margin: 0 auto; }
        .modal-content h3 { margin-top: 0; color: #00bcd4; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 20px; font-size: 18px; text-align: center; text-transform: uppercase; }

        #CustomModal .modal-content { max-width: 380px; text-align: center; }
        #CustomModalMesaj { font-size: 15px; line-height: 1.5; color: #e0e0e0; margin-bottom: 25px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 12px; }
        .form-grid-tam { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; font-weight: 500; transition: color 0.3s; }
        .label-kasa-vurgu { color: #ff9800 !important; font-weight: bold !important; }
        
        .modal-content input[type="text"], .modal-content select { width: 100%; padding: 10px; background-color: #121212; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; text-transform: uppercase; }
        .modal-content input[type="text"]::placeholder { text-transform: none; }
        .modal-content input[type="text"]:focus, .modal-content select:focus { border-color: #00bcd4; }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .sayi-input-grup { display: flex; align-items: center; background-color: #121212; border: 1px solid #444; border-radius: 6px; overflow: hidden; transition: border-color 0.2s; }
        .sayi-input-grup:focus-within { border-color: #00bcd4; }
        .sayi-input-grup button { background-color: #2a2a2a; color: #00bcd4; border: none; padding: 10px 14px; font-size: 16px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
        .sayi-input-grup button:hover { background-color: #3d3d3d; color: #fff; }
        .sayi-input-grup input { flex: 1; width: 100%; border: none; background: transparent; text-align: center; font-size: 15px; font-weight: bold; color: #fff; padding: 10px 0; outline: none; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 25px; padding-top: 15px; border-top: 1px solid #333; justify-content: center; }
        .btn-kaydet { background-color: #4caf50; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; font-size:15px; }
        .btn-kaydet:hover { background-color: #388e3c; }
        .btn-iptal { background-color: #f44336; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; font-size:15px;}
        .btn-iptal:hover { background-color: #d32f2f; }

        /* YENİ ŞIK LOG LİSTESİ TASARIMI VE LOG ARAMA KUTUSU */
        #LogModal .modal-content { max-width: 550px; max-height: 90vh; display: flex; flex-direction: column; padding: 25px 20px; background-color: #121212; border: 1px solid #333;}
        
        #logAramaKutusu { width: 100%; padding: 12px; margin-bottom: 15px; background-color: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; outline: none; text-transform: uppercase;}
        #logAramaKutusu:focus { border-color: #9c27b0; }
        #logAramaKutusu::placeholder { text-transform: none; }

        .log-liste-alani { flex: 1; overflow-y: auto; padding-right: 5px; }
        .log-kart { background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 15px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .log-kart-ust { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .log-tarih { font-size: 12px; color: #888; }
        .log-kullanici { font-size: 12px; font-weight: bold; color: #00bcd4; background: #222; padding: 3px 8px; border-radius: 12px; }
        
        /* LOG KOD VE KATEGORİ ALANI YENİDEN TASARLANDI */
        .log-kod-alani { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px 0; background-color: #222; padding: 8px 10px; border-radius: 6px; }
        .log-sol-bilgi { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .log-kategori-etiket { background-color: #2a2a2a; color: #00bcd4; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .log-kasa-etiket { background-color: #ff5722 !important; color: #fff !important; }
        .log-marka { font-size: 12px; font-weight: bold; color: #aaa; text-transform: uppercase; }
        .log-kod-span { font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 1px; text-transform: uppercase; text-align: right; }
        
        .log-islem-detay { font-size: 13.5px; line-height: 1.5; color: #ccc; background-color: #222; padding: 10px; border-radius: 6px; border-left: 3px solid; }

        /* MOBİL UYARLAMA KISMI */
        @media screen and (max-width: 650px) {
            .header { flex-direction: column; align-items: stretch; width: 100%; }
            
            .buton-grup { flex-wrap: wrap; order: -1; width: 100%; }
            
            .ana-baslik { font-size: 20px; margin-bottom: 10px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
            .baslik-ayrac { display: none; }
            .baslik-alt { display: block; margin-top: 5px; font-size: 18px; color: #ffd700; }
            
            /* DİKKAT: SABİT 200PX YÜKSEKLİK, ZARİF KÜÇÜK YAZI, BOL BOŞLUK */
            #aramaKutusu, #kategoriFiltre, #markaFiltre { 
                height: 200px !important; 
                width: 100%; 
                font-size: 16px !important; 
                font-weight: bold; 
                text-align: center; 
                border-radius: 12px; 
                padding: 10px !important; 
            }
            
            #aramaKutusu::placeholder { font-size: 15px !important; font-weight: normal; }
            
            .stok-satir { grid-template-columns: 1fr; gap: 12px; width: 100%; }
            
            .stok-sayilar { grid-template-columns: repeat(5, 1fr); gap: 3px; }
            .sayi-kutusu { font-size: 8.5px; padding: 4px 0; text-transform: none !important; font-weight: 700; white-space: nowrap; letter-spacing: -0.2px; } 
            .sayi-deger, .sayi-toplam, .sayi-arizali { font-size: 13px; margin-top: 3px; }
            
            .btn-duzenle, .btn-pasif { width: 100%; }
            .modal-content { padding: 20px; width: 90%; }
            
            #LogModal .modal-content { padding: 15px 10px; width: 95%; }
            .log-kart { padding: 10px; }
            .log-islem-detay { font-size: 12px; padding: 8px; }
            .log-kod-alani { flex-direction: column; align-items: flex-start; gap: 8px; }
            .log-kod-span { text-align: left; width: 100%; border-top: 1px dashed #444; padding-top: 8px; }
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="authEkrani">
        <div class="auth-kutu">
            <h2>Stok Sistemi Giriş</h2>
            <form onsubmit="event.preventDefault(); girisYap();">
                <input type="email" id="authEmail" name="email" autocomplete="username" placeholder="E-posta Adresiniz" required>
                <input type="password" id="authSifre" name="password" autocomplete="current-password" placeholder="Şifreniz" required>
                <button type="submit" class="btn-auth">Giriş Yap</button>
                <button type="button" class="btn-auth btn-kayitol" onclick="kayitOl()">Hesap Oluştur</button>
                <div style="margin-top: 15px;"><span class="link-unuttum" onclick="sifremiUnuttum()">Şifremi Unuttum</span></div>
            </form>
            <div id="authMesaj" style="margin-top: 15px; font-size: 13px; color: #f44336;"></div>
        </div>
    </div>

    <!-- ŞİFRE SIFIRLAMA EKRANI -->
    <div id="SifreSifirlamaEkrani" style="display: none;">
        <div class="auth-kutu">
            <h2>Yeni Şifre Belirle</h2>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Lütfen yeni şifrenizi girin.</p>
            <input type="password" id="yeniSifreInput" placeholder="Yeni Şifreniz" required>
            <button type="button" class="btn-auth" onclick="yeniSifreKaydet()">Şifreyi Güncelle</button>
            <div id="sifreSifirlaMesaj" style="margin-top: 15px; font-size: 13px; color: #f44336;"></div>
        </div>
    </div>

    <!-- ANA UYGULAMA -->
    <div id="anaUygulama">
        <div class="sabit-ust-alan">
            <div class="container ust-bosluklu-container">
                <h1 class="ana-baslik">TEMEL OTOMASYON<span class="baslik-ayrac"> - </span><span class="baslik-alt">STOK LİSTESİ</span></h1>

                <div class="header">
                    <input type="text" id="aramaKutusu" placeholder="Malzeme Kodu Ara..." oninput="this.value = this.value.toLocaleUpperCase('tr-TR'); stokGetir()">
                    
                    <select id="kategoriFiltre" onchange="stokGetir()">
                        <option value="">Tüm Kategoriler</option>
                        <option value="PLC">PLC</option>
                        <option value="EKRAN">EKRAN</option>
                        <option value="RÖLE">RÖLE</option>
                        <option value="SÜRÜCÜ">SÜRÜCÜ</option>
                        <option value="MOTOR">MOTOR</option>
                        <option value="KASALAR">KASALAR</option>
                    </select>

                    <select id="markaFiltre" onchange="stokGetir()">
                        <option value="">Tüm Markalar</option>
                    </select>
                    
                    <div class="buton-grup">
                        <button id="btnYeniEkle" class="btn-yeni" onclick="yeniKayitModalAc()" style="display:none;">+ Yeni Ekle</button>
                        <button class="btn-excel" onclick="excelDokumuAl()">Excel'e Aktar</button>
                        <button class="btn-log" onclick="logModalAc()">Log</button>
                        <button class="btn-cikis" onclick="cikisYap()">Çıkış</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div id="listeGövdesi" class="liste-alani"></div>
        </div>
    </div>

    <!-- ÖZEL UYARI MODALI -->
    <div id="CustomModal" class="modal" style="z-index: 3000;">
        <div class="modal-content">
            <h3 id="CustomModalBaslik" style="color: #ff9800;">Sistem Mesajı</h3>
            <p id="CustomModalMesaj"></p>
            <div class="modal-buttons" style="border-top: none; padding-top: 0; margin-top: 0;">
                <button id="btnCustomTamam" class="btn-kaydet">Tamam</button>
                <button id="btnCustomGeri" class="btn-iptal">Geri Dön</button>
            </div>
        </div>
    </div>

    <!-- YENİ ŞIK KARTLI LOG MODALI VE ARAMA -->
    <div id="LogModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#9c27b0; margin-top:0; margin-bottom: 15px; flex-shrink: 0; text-align: center;">SİSTEM HAREKETLERİ</h3>
            
            <input type="text" id="logAramaKutusu" placeholder="Malzeme Koduna Göre Log Ara..." oninput="logIciAra()">
            
            <div class="log-liste-alani" id="logGövdesi">
                <div style="text-align:center; color:#888; padding:20px;">Yükleniyor...</div>
            </div>
            <button class="btn-iptal" style="width:100%; margin-top:15px; flex-shrink: 0;" onclick="document.getElementById('LogModal').style.display='none'">Kapat</button>
        </div>
    </div>

    <!-- GÜNCELLEME / YENİ KAYIT MODALI -->
    <div id="GuncelleModal" class="modal">
        <div class="modal-content">
            <h3 id="modalBaslik">Miktar Güncelle</h3>
            <input type="hidden" id="duzenlenenId">
            <datalist id="markaListesi"></datalist>

            <div class="form-grid">
                <div class="form-group" id="grupKategori">
                    <label>Kategori:</label>
                    <select id="inputKategori" onchange="kategoriDegisti()">
                        <option value="">Seçiniz...</option>
                        <option value="PLC">PLC</option>
                        <option value="EKRAN">EKRAN</option>
                        <option value="RÖLE">RÖLE</option>
                        <option value="SÜRÜCÜ">SÜRÜCÜ</option>
                        <option value="MOTOR">MOTOR</option>
                        <option value="KASALAR">KASALAR</option>
                    </select>
                </div>
                <div class="form-group" id="grupMarka">
                    <label>Marka:</label>
                    <input type="text" id="inputMarka" list="markaListesi" autocomplete="off" placeholder="Örn: SIEMENS" oninput="this.value = this.value.toLocaleUpperCase('tr-TR')">
                </div>
                <div class="form-group form-grid-tam" id="grupKod">
                    <label>Malzeme Kodu:</label>
                    <input type="text" id="inputKod" placeholder="Tam kodunu girin..." oninput="this.value = this.value.toLocaleUpperCase('tr-TR')">
                </div>

                <div class="form-group">
                    <label>İkinci el Adet:</label>
                    <div class="sayi-input-grup">
                        <button type="button" onclick="sayiDegistir('inputIkinciEl', -1)">-</button>
                        <input type="number" id="inputIkinciEl" value="0">
                        <button type="button" onclick="sayiDegistir('inputIkinciEl', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Açık Kutu Adet:</label>
                    <div class="sayi-input-grup">
                        <button type="button" onclick="sayiDegistir('inputAcikKutu', -1)">-</button>
                        <input type="number" id="inputAcikKutu" value="0">
                        <button type="button" onclick="sayiDegistir('inputAcikKutu', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Kapalı Kutu Adet:</label>
                    <div class="sayi-input-grup">
                        <button type="button" onclick="sayiDegistir('inputKapaliKutu', -1)">-</button>
                        <input type="number" id="inputKapaliKutu" value="0">
                        <button type="button" onclick="sayiDegistir('inputKapaliKutu', 1)">+</button>
                    </div>
                </div>
                <div class="form-group">

        function baslat() {

        async function stokGetir() {
            clearTimeout(aramaZamanlayici);
            aramaZamanlayici = setTimeout(async () => {
                const aranan = document.getElementById('aramaKutusu').value.trim();
                const kategori = document.getElementById('kategoriFiltre').value;
                const marka = document.getElementById('markaFiltre').value;

                if (!aranan && !kategori && !marka) {
                    baslat();
                    return;
                }

                document.getElementById('listeGövdesi').innerHTML = '<div style="text-align:center; color:#00bcd4; padding:30px;">Aranıyor...</div>';

                if (!aranan) {
                    let sorgu = sbClient.from('malzemeler').select('*').order('marka', { ascending: true }).order('id', { ascending: true });
                    if (kategori) sorgu = sorgu.ilike('kategori', `%${kategori}%`);
                    if (marka) sorgu = sorgu.ilike('marka', `%${marka}%`);
                    
                    const { data, error } = await sorgu.limit(100);
                    if (error) return;
                    ekranaYazdir(data);
                } else {
                    let sorgu = sbClient.from('malzemeler').select('*').order('marka', { ascending: true }).order('id', { ascending: true });
                    if (kategori) sorgu = sorgu.ilike('kategori', `%${kategori}%`);
                    if (marka) sorgu = sorgu.ilike('marka', `%${marka}%`);
                    
                    const { data, error } = await sorgu.limit(5000);
                    if (error) return;
                    
                    const temizAranan = aranan.replace(/[-/.\s]/g, '').toLocaleLowerCase('tr-TR');
                    const filtrelenmis = data.filter(m => {
                        const temizKod = (m.kod || '').replace(/[-/.\s]/g, '').toLocaleLowerCase('tr-TR');
                        return temizKod.includes(temizAranan);
                    });
                    
                    ekranaYazdir(filtrelenmis.slice(0, 100));
                }
            }, 300);
        }

        function ekranaYazdir(veriler) {
            const liste = document.getElementById('listeGövdesi');

            if(!veriler || veriler.length === 0) {
                liste.innerHTML = '<div style="text-align:center; color:#f44336; padding:30px;">Kayıt bulunamadı.</div>';
                return;
            }

            veriler.forEach(malzeme => {
                let islemButonu = '';
                if(aktifRol === 'duzenleyici') {
                    const mJson = JSON.stringify(malzeme).replace(/'/g, "&#39;");
                    islemButonu = `<button class="btn-duzenle" onclick='guncelleModalAc(${mJson})'>Güncelle</button>`;
                } else {
                    islemButonu = `<button class="btn-pasif" disabled title="Sadece izleme yetkiniz var">İzleyici</button>`;
                }

                const isKasa = malzeme.kategori === 'KASALAR';
                
                const formatliMarka = (malzeme.marka || '-').toLocaleUpperCase('tr-TR');
                const formatliKod = (malzeme.kod || '').toLocaleUpperCase('tr-TR');

                const ikinciElBaslik = telefonMu() ? "İkinci El" : "İKİNCİ EL";

                const kapaliKutuBaslik = telefonMu() ? "K.Kutu" : "KAPALI KUTU";

                const toplamBaslik = telefonMu() ? "Toplam" : "TOPLAM";

                const satirClass = isKasa ? "stok-satir kasa-satir" : "stok-satir";
                const etiketClass = isKasa ? "kategori-etiket kasa-etiket" : "kategori-etiket";
                const rafMetni = isKasa ? `<span class="kasa-no-vurgu">Kasa: ${malzeme.raf_no || '-'}</span>` : `<span class="raf-no-vurgu">Raf: ${malzeme.raf_no || '-'}</span>`;

                const satir = `
                    <div class="${satirClass}">
                        <div class="stok-bilgi">
                            <div class="stok-ust-satir">
                                <span class="${etiketClass}">${malzeme.kategori || '-'}</span>
                                <span class="malzeme-kod" title="${formatliKod}">${formatliKod}</span>
                            </div>
                            <div class="malzeme-detay">
                                Marka: <strong>${formatliMarka}</strong> | ${rafMetni}
                            </div>
                        </div>

                        <div class="stok-sayilar">
                            <div class="sayi-kutusu">${ikinciElBaslik}<div class="sayi-deger">${malzeme.ikinci_el ?? 0}</div></div>
                            <div class="sayi-kutusu">${acikKutuBaslik}<div class="sayi-deger">${malzeme.acik_kutu ?? 0}</div></div>
                            <div class="sayi-kutusu">${kapaliKutuBaslik}<div class="sayi-deger">${malzeme.kapali_kutu ?? 0}</div></div>
                            <div class="sayi-kutusu">${arizaliBaslik}<div class="sayi-arizali">${malzeme.arizali ?? 0}</div></div>
                            <div class="sayi-kutusu">${toplamBaslik}<div class="sayi-toplam">${malzeme.toplam ?? 0}</div></div>
                        </div>
                        ${islemButonu}
                    </div>
                `;
                liste.innerHTML += satir;
            });
        }

        async function veriKaydetPreCheck() {
            if(aktifRol !== 'duzenleyici') return;

            const kategori = document.getElementById('inputKategori').value; 
            let marka = document.getElementById('inputMarka').value.trim().toLocaleUpperCase('tr-TR');
            let kod = document.getElementById('inputKod').value.trim().toLocaleUpperCase('tr-TR'); 
            const raf_no = document.getElementById('inputRafNo').value.trim().toLocaleUpperCase('tr-TR');

            const eAdet = parseInt(document.getElementById('inputIkinciEl').value) || 0;
            const aAdet = parseInt(document.getElementById('inputAcikKutu').value) || 0;
            const kAdet = parseInt(document.getElementById('inputKapaliKutu').value) || 0;
            const rAdet = parseInt(document.getElementById('inputArizali').value) || 0;
            const toplamAdetGiris = eAdet + aAdet + kAdet + rAdet;

            if (islemTuru === 'yeni') {
                let bosAlanlar = [];
                if (!kategori) bosAlanlar.push("Kategori");
                if (!marka) bosAlanlar.push("Marka");
                if (!kod) bosAlanlar.push("Malzeme Kodu");

                if (bosAlanlar.length > 0) {
                    uyariGoster("Lütfen aşağıdaki zorunlu alanları doldurun:<br><br><b style='color:#00bcd4;'>" + bosAlanlar.join("<br>") + "</b>", 'hata');
                    return;
                }
                
                if (toplamAdetGiris <= 0) {
                    uyariGoster("Yeni malzeme eklerken İkinci El, Açık Kutu, Kapalı Kutu veya Arızalı adetlerinden <b style='color:#00bcd4;'>en az birini</b> girmelisiniz.<br>Sadece kod eklemenin bir anlamı yok!", 'hata');
                    return;
                }

                if (kategori !== 'KASALAR') {
                    const { data: mevcutData } = await sbClient.from('malzemeler')
                        .select('kod')
                        .ilike('kod', kod)
                        .neq('kategori', 'KASALAR');

                    if (mevcutData && mevcutData.length > 0) {
                        uyariGoster("Bu kod sisteme zaten normal rafta daha önceden kayıt edilmiş!<br>Aynı kodu normal kategorilerde tekrar ekleyemezsiniz.", 'hata');
                        return;
                    }
                }

                if (!raf_no) {
                    const msgRaf = kategori === 'KASALAR' ? "Kasa" : "Raf";
                    uyariGoster(`${msgRaf} numarasını boş bıraktınız.<br>Yine de devam etmek istiyor musunuz?`, 'onay', () => { gercekVeriKaydet(kategori, marka, kod, raf_no); });
                    return;
                }
            } else {
                if (!kod) { uyariGoster("Malzeme kodu boş olamaz!", 'hata'); return; }
                if (!raf_no) {
                    const msgRaf = kategori === 'KASALAR' ? "Kasa" : "Raf";
                    uyariGoster(`${msgRaf} numarasını boş bıraktınız.<br>Yine de devam etmek istiyor musunuz?`, 'onay', () => { gercekVeriKaydet(kategori, marka, kod, raf_no); });
                    return;
                }
            }
            
            gercekVeriKaydet(kategori, marka, kod, raf_no);
        }

        async function gercekVeriKaydet(kategori, marka, kod, raf_no) {
            const ikinci_el = parseInt(document.getElementById('inputIkinciEl').value) || 0;
            const acik_kutu = parseInt(document.getElementById('inputAcikKutu').value) || 0;
            const kapali_kutu = parseInt(document.getElementById('inputKapaliKutu').value) || 0;
            const arizali = parseInt(document.getElementById('inputArizali').value) || 0;
            const toplam = ikinci_el + acik_kutu + kapali_kutu;
            
            if (islemTuru === 'guncelle') {
                const id = document.getElementById('duzenlenenId').value;
                const { error } = await sbClient.from('malzemeler').update({ 
                    ikinci_el, acik_kutu, kapali_kutu, arizali, toplam, raf_no 
                }).eq('id', id);

                if (!error) {
                    let e1 = aktifDuzenlenenMalzeme.ikinci_el || 0;
                    let a1 = aktifDuzenlenenMalzeme.acik_kutu || 0;
                    let k1 = aktifDuzenlenenMalzeme.kapali_kutu || 0;
                    let r1 = aktifDuzenlenenMalzeme.arizali || 0;

                    let logMetni = `GÜNCELLEME<br>İkinci El (${e1} → ${ikinci_el}) - Açık Kutu (${a1} → ${acik_kutu})<br>Kapalı Kutu (${k1} → ${kapali_kutu}) - Arızalı (${r1} → ${arizali})`;
                    await logKaydet(logMetni, kod);
                    basariSonrasi();
                } else {
                    uyariGoster("<b>Veritabanı Kayıt Hatası:</b><br>" + error.message, 'hata');
                }

            } else {
                const { error } = await sbClient.from('malzemeler').insert([{ 
                    kategori, marka, kod, ikinci_el, acik_kutu, kapali_kutu, arizali, toplam, raf_no 
                }]);

                if (!error) {
                    let vE = ikinci_el === 0 ? '' : ikinci_el;
                    let vA = acik_kutu === 0 ? '' : acik_kutu;
                    let vK = kapali_kutu === 0 ? '' : kapali_kutu;
                    let vR = arizali === 0 ? '' : arizali;

                    let logMetni = `YENİ KAYIT<br>İkinci El (${vE}) - Açık Kutu (${vA})<br>Kapalı Kutu (${vK}) - Arızalı (${vR})`;
                    await logKaydet(logMetni, kod);
                    secenekleriYukle(); 
                    basariSonrasi();
                } else {
                    if (error.message.includes('duplicate key') || error.message.includes('unique constraint')) {
                        uyariGoster("<b>Veritabanı Engelledi!</b><br><br>Supabase veritabanınızda 'kod' sütunu hala <b>'Is Unique' (Benzersiz)</b> olarak işaretli. Bu yüzden aynı kodu kasalara tekrar eklemenize veritabanı izin vermiyor.<br><br><b>Çözüm:</b> Lütfen Supabase'den 'Table Editor'e girin, malzemeler tablosunda 'kod' sütununu düzenleyip 'Is Unique' tikini kaldırın.", 'hata');
                    } else {
                        uyariGoster("<b>Kayıt sırasında hata oluştu:</b><br>" + error.message, 'hata');
                    }
                }
            }
        }

        function basariSonrasi() {
            document.getElementById('GuncelleModal').style.display = 'none';
            stokGetir(); 
        }

        async function logKaydet(islemTipiVeDetay, parcaKodu) {
            await sbClient.from('log_kayitlari').insert([{ kullanici: aktifKullaniciEmail, islem: islemTipiVeDetay, kod: parcaKodu }]);
        }

        async function logModalAc() {
            document.getElementById('logAramaKutusu').value = '';
            document.getElementById('LogModal').style.display = 'flex';
            const logGövdesi = document.getElementById('logGövdesi');
            logGövdesi.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">Kayıtlar çekiliyor...</div>';

            // 1. Log tablosundan en son 200 kaydı çek
            const { data: logData, error: logError } = await sbClient.from('log_kayitlari').select('*').order('tarih', { ascending: false }).limit(200);

            if (logError || !logData) { logGövdesi.innerHTML = '<div style="text-align:center; color:#f44336; padding:20px;">Kayıtlar alınamadı!</div>'; return; }

            // 2. Malzemeler tablosundan tüm kodların Kategori ve Marka bilgilerini çek
            const { data: malzemeData } = await sbClient.from('malzemeler').select('kod, kategori, marka');
            
            // Kodları hızlı eşleştirebilmek için bir sözlük (map) oluşturuyoruz
            const malzemeMap = {};
            if (malzemeData) {
                malzemeData.forEach(m => {
                    malzemeMap[(m.kod || '').toLocaleUpperCase('tr-TR')] = {
                        kategori: m.kategori || '-',
                        marka: (m.marka || '-').toLocaleUpperCase('tr-TR')
                    };
                });
            }

            // 3. Logları bu bilgilerle birleştiriyoruz
            tumLoglar = logData.map(log => {
                const mapInfo = malzemeMap[(log.kod || '').toLocaleUpperCase('tr-TR')] || { kategori: '-', marka: '-' };
                return { ...log, kategori: mapInfo.kategori, marka: mapInfo.marka };
            });

            loglariCiz(tumLoglar);
        }

        function loglariCiz(logDizisi) {
            const logGövdesi = document.getElementById('logGövdesi');
            logGövdesi.innerHTML = '';
            
            if(logDizisi.length === 0) {
                logGövdesi.innerHTML = '<div style="text-align:center; color:#f44336; padding:20px;">Arama kriterine uygun log bulunamadı.</div>';
                return;
            }

            logDizisi.forEach(log => {
                const tarih = new Date(log.tarih).toLocaleString('tr-TR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const islemRengi = log.islem.includes('YENİ') ? '#4caf50' : '#00bcd4';
                
                let hamIslem = log.islem;
                if (hamIslem.includes("GÜNCELLEME: ")) hamIslem = hamIslem.replace("GÜNCELLEME: ", "GÜNCELLEME<br>");
                else if (hamIslem.includes("YENİ KAYIT: ")) hamIslem = hamIslem.replace("YENİ KAYIT: ", "YENİ KAYIT<br>");

                if (hamIslem.includes(", Kapalı") && !hamIslem.includes("<br>Kapalı")) {
                    hamIslem = hamIslem.replace(", Kapalı", "<br>Kapalı");
                }

                hamIslem = hamIslem.replace(/->/g, "→");
                let islemParcalari = hamIslem.split('<br>');
                let islemBaslik = `<span style="color:${islemRengi}; font-weight:bold; font-size:14px; display:block; margin-bottom:4px;">${islemParcalari[0]}</span>`;
                let islemAltYazi = islemParcalari.length > 1 ? islemParcalari.slice(1).join('<br>') : '';

                // KASALAR için özel renk kontrolü
                const etiketClass = log.kategori === 'KASALAR' ? 'log-kategori-etiket log-kasa-etiket' : 'log-kategori-etiket';

                logGövdesi.innerHTML += `
                    <div class="log-kart">
                        <div class="log-kart-ust">
                            <span class="log-tarih">${tarih}</span>
                            <span class="log-kullanici">@${log.kullanici.split('@')[0]}</span>
                        </div>
                        
                        <div class="log-kod-alani">
                            <div class="log-sol-bilgi">
                                <span class="${etiketClass}">${log.kategori}</span>
                                <span class="log-marka">${log.marka}</span>
                            </div>
                            <span class="log-kod-span">${log.kod}</span>
                        </div>

                        <div class="log-islem-detay" style="border-left-color: ${islemRengi}">
                            ${islemBaslik}
                            ${islemAltYazi}
                        </div>
                    </div>
                `;
            });
        }

        function logIciAra() {
            const aranan = document.getElementById('logAramaKutusu').value.trim().toLocaleUpperCase('tr-TR');
            if (!aranan) {
                loglariCiz(tumLoglar);
                return;
            }
            const filtrelenmis = tumLoglar.filter(log => (log.kod || '').toLocaleUpperCase('tr-TR').includes(aranan));
            loglariCiz(filtrelenmis);
        }

        function guncelleModalAc(malzeme) {
            islemTuru = 'guncelle';
            aktifDuzenlenenMalzeme = malzeme;
            
            document.getElementById('duzenlenenId').value = malzeme.id;
            document.getElementById('modalBaslik').innerText = `${malzeme.kod} GÜNCELLE`;
            
            document.getElementById('grupKategori').style.display = 'none';
            document.getElementById('grupMarka').style.display = 'none';
            document.getElementById('grupKod').style.display = 'none';
            
            document.getElementById('inputKategori').value = malzeme.kategori || '';
            kategoriDegisti();
            
            document.getElementById('inputKod').value = malzeme.kod; 

            document.getElementById('inputIkinciEl').value = malzeme.ikinci_el || 0;
            document.getElementById('inputAcikKutu').value = malzeme.acik_kutu || 0;
            document.getElementById('inputKapaliKutu').value = malzeme.kapali_kutu || 0;
            document.getElementById('inputArizali').value = malzeme.arizali || 0;
            document.getElementById('inputRafNo').value = malzeme.raf_no || '';
            
            document.getElementById('GuncelleModal').style.display = 'flex';
        }

        function yeniKayitModalAc() {
            islemTuru = 'yeni';
            aktifDuzenlenenMalzeme = null;

            document.getElementById('modalBaslik').innerText = 'YENİ MALZEME EKLE';
            
            document.getElementById('grupKategori').style.display = 'block';
            document.getElementById('grupMarka').style.display = 'block';
            document.getElementById('grupKod').style.display = 'block';

            document.getElementById('inputKategori').value = '';
            kategoriDegisti(); 

            document.getElementById('inputMarka').value = '';
            document.getElementById('inputKod').value = '';
            document.getElementById('inputIkinciEl').value = 0;
            document.getElementById('inputAcikKutu').value = 0;
            document.getElementById('inputKapaliKutu').value = 0;
            document.getElementById('inputArizali').value = 0;
            document.getElementById('inputRafNo').value = '';
            
            document.getElementById('GuncelleModal').style.display = 'flex';
        }

        function excelDokumuAl() {
            uyariGoster("Şu anki görünen tabloyu indirmek istiyor musunuz?", "onay", async () => {
                const aranan = document.getElementById('aramaKutusu').value.trim();
                const kategori = document.getElementById('kategoriFiltre').value;
                const marka = document.getElementById('markaFiltre').value;
                let sorgu = sbClient.from('malzemeler').select('*').order('marka', { ascending: true });
                
                if (kategori) sorgu = sorgu.ilike('kategori', `%${kategori}%`);
                if (marka) sorgu = sorgu.ilike('marka', `%${marka}%`);
                if (aranan) sorgu = sorgu.ilike('kod', `%${aranan}%`);
                
                const { data, error } = await sorgu.limit(5000);
                if (error || !data || data.length === 0) { alert("Döküm alınacak kayıt bulunamadı!"); return; }

                let htmlTablo = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                    <table border="1" style="border-collapse:collapse; text-align:center; vertical-align:middle; font-family:Arial, sans-serif;">
                        <thead>
                            <tr style="background-color:#d9d9d9; font-weight:bold; height:30px;">
                                <th>Kategori</th>
                                <th>Marka</th>
                                <th>Malzeme Kodu</th>
                                <th>İkinci el</th>
                                <th>Açık Kutu</th>
                                <th>Kapalı Kutu</th>
                                <th>Arızalı</th>
                                <th>Toplam</th>
                                <th>Raf / Kasa No</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(m => {
                    const formatliMarka = (m.marka || '').toLocaleUpperCase('tr-TR');
                    const formatliKod = (m.kod || '').toLocaleUpperCase('tr-TR');
                    htmlTablo += `
                            <tr style="height:25px;">
                                <td>${m.kategori || ''}</td>
                                <td>${formatliMarka}</td>
                                <td style="font-weight:bold;">${formatliKod}</td>
                                <td>${m.ikinci_el ?? 0}</td>
                                <td>${m.acik_kutu ?? 0}</td>
                                <td>${m.kapali_kutu ?? 0}</td>
                                <td>${m.arizali ?? 0}</td>
                                <td style="font-weight:bold; color:green;">${m.toplam ?? 0}</td>
                                <td>${m.raf_no || ''}</td>
                            </tr>`;
                });

                htmlTablo += `</tbody></table></body></html>`;

                const blob = new Blob([htmlTablo], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "stok_dokumu.xls";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
</html>
